# Configuración de Conexión a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/bkddb?connectTimeout=5
spring.datasource.username=bkseducate
spring.datasource.password=bkseducate2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración de Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (el secreto debe tener mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Usuario administrador inicial (cámbialo con variables de entorno)
app.security.admin.email=${ADMIN_EMAIL:admin@tarea.com}
app.security.admin.password=${ADMIN_PASSWORD:Admin123*}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
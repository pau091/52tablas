# Configuración de Conexión a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/bkddb?connectTimeout=5
spring.datasource.username=bkseducate
spring.datasource.password=bkseducate2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración de Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0